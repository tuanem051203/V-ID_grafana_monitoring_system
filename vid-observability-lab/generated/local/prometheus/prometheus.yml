global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          environment: local
          cluster: docker-compose

  - job_name: vid-metrics-simulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - metrics-simulator:8000
        labels:
          environment: local
          cluster: docker-compose
