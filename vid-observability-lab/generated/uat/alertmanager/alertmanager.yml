global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.uat.example.com:587"
  smtp_from: "vid-alerts-uat@example.com"
  smtp_auth_username: "vid-alerts-uat@example.com"
  smtp_auth_password_file: "/run/secrets/smtp_password"
  smtp_require_tls: true

templates:
  - "templates/*.tmpl"

route:
  receiver: uat-warning-email
  group_by: [alertname, environment, cluster, service]
  group_wait: 30s
  group_interval: 10m
  repeat_interval: 8h
  routes:
    - receiver: uat-critical-email
      matchers:
        - 'severity="critical"'
      repeat_interval: 2h

receivers:
  - name: uat-warning-email
    email_configs:
      - to: "vid-sre-uat@example.com"
        send_resolved: true
        html: '{{ template "vid.email.html" . }}'
        text: '{{ template "vid.email.text" . }}'
        headers:
          Subject: '[V-ID][uat][WARNING][{{ .Status }}] {{ .CommonLabels.alertname }}'

  - name: uat-critical-email
    email_configs:
      - to: "vid-sre-uat@example.com"
        send_resolved: true
        html: '{{ template "vid.email.html" . }}'
        text: '{{ template "vid.email.text" . }}'
        headers:
          Subject: '[V-ID][uat][CRITICAL][{{ .Status }}] {{ .CommonLabels.alertname }}'

inhibit_rules:
  - source_matchers:
      - 'severity="critical"'
    target_matchers:
      - 'severity="warning"'
    equal:
      - environment
      - cluster
      - service
