global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "vid-alerts@example.com"
  smtp_auth_username: "vid-alerts@example.com"
  smtp_auth_password_file: "/run/secrets/smtp_password"
  smtp_require_tls: true

templates:
  - "templates/*.tmpl"

route:
  receiver: production-warning-email
  group_by:
    - alertname
    - environment
    - cluster
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: production-critical-email
      matchers:
        - 'severity="critical"'
      repeat_interval: 1h

receivers:
  - name: production-warning-email
    email_configs:
      - to: "vid-sre@example.com"
        send_resolved: true
        html: '{{ template "vid.email.html" . }}'
        text: '{{ template "vid.email.text" . }}'
        headers:
          Subject: '[V-ID][PROD][WARNING][{{ .Status }}] {{ .CommonLabels.alertname }}'

  - name: production-critical-email
    email_configs:
      - to: "vid-sre@example.com,vid-oncall@example.com"
        send_resolved: true
        html: '{{ template "vid.email.html" . }}'
        text: '{{ template "vid.email.text" . }}'
        headers:
          Subject: '[V-ID][PROD][CRITICAL][{{ .Status }}] {{ .CommonLabels.alertname }}'

inhibit_rules:
  - source_matchers:
      - 'severity="critical"'
    target_matchers:
      - 'severity="warning"'
    equal:
      - environment
      - cluster
      - service
