global:
  resolve_timeout: 5m

route:
  receiver: local-log
  group_by:
    - alertname
    - environment
    - cluster
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-log
      matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  # Local/UAT receiver intentionally sends no external notification. Production
  # must replace this with the approved on-call integration and secret source.
  - name: local-log

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - environment
      - cluster
      - service
