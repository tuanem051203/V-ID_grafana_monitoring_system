global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "tuanem051203@gmail.com"
  smtp_auth_username: "tuanem051203@gmail.com"
  smtp_auth_password_file: "/run/secrets/smtp_password"
  smtp_require_tls: true

route:
  receiver: gmail-email
  group_by:
    - alertname
    - environment
    - cluster
    - service
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: gmail-email
      matchers:
        - 'severity="critical"'
      repeat_interval: 1h

receivers:
  - name: gmail-email
    email_configs:
      - to: "tuanem051201@gmail.com"
        send_resolved: true
        headers:
          Subject: '[V-ID][{{ .Status }}] {{ .CommonLabels.alertname }}'

inhibit_rules:
  - source_matchers:
      - 'severity="critical"'
    target_matchers:
      - 'severity="warning"'
    equal:
      - environment
      - cluster
      - service
