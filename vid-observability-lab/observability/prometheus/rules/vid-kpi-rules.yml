            rate(token_request_total[30d])
          ), 1e-9)

      - record: vid:kpi_platform_availability:ratio6h
        expr: |
          1 - (
            sum by (environment, cluster) (
              rate(http_requests_5xx_total{critical="true"}[6h])
            )
            /
            clamp_min(sum by (environment, cluster) (
              rate(http_requests_total{critical="true"}[6h])
