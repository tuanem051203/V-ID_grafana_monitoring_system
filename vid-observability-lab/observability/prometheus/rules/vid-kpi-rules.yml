              le="0.5"
            }[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(auth_request_duration_seconds_count[24h])
          ), 1e-9)
      - record: vid:kpi_authentication_latency_under_500ms:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(auth_request_duration_seconds_bucket{
              le="0.5"
            }[30d])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(auth_request_duration_seconds_count[30d])
          ), 1e-9)

      - record: vid:kpi_otp_delivery_success:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(otp_delivery_success_total[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(otp_send_total[6h])
          ), 1e-9)
      - record: vid:kpi_otp_delivery_success:ratio24h
        expr: |
          sum by (environment, cluster) (
            rate(otp_delivery_success_total[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(otp_send_total[24h])
          ), 1e-9)
      - record: vid:kpi_otp_delivery_success:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(otp_delivery_success_total[30d])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(otp_send_total[30d])
          ), 1e-9)

      - record: vid:kpi_otp_verification_success:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(otp_verify_success_total[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(otp_verify_total[6h])
          ), 1e-9)
      - record: vid:kpi_otp_verification_success:ratio24h
        expr: |
          sum by (environment, cluster) (
            rate(otp_verify_success_total[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(otp_verify_total[24h])
          ), 1e-9)
      - record: vid:kpi_otp_verification_success:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(otp_verify_success_total[30d])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(otp_verify_total[30d])
          ), 1e-9)

      - record: vid:kpi_token_issuance_success:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(token_issue_total[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(token_request_total[6h])
          ), 1e-9)
      - record: vid:kpi_token_issuance_success:ratio24h
        expr: |
          sum by (environment, cluster) (
            rate(token_issue_total[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(token_request_total[24h])
          ), 1e-9)
      - record: vid:kpi_token_issuance_success:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(token_issue_total[30d])
          )
          /
