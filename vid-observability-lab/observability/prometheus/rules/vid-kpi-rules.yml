            ), 1e-9)
          )

  - name: vid-slo-error-budget
    interval: 30s
    rules:
      # Burn rate = bad-event ratio / allowed bad-event ratio.
      - record: vid:slo_authentication_success:burnrate5m
        expr: (1 - vid:kpi_authentication_success:ratio5m) / (1 - 0.999)
      - record: vid:slo_authentication_success:burnrate1h
        expr: (1 - vid:kpi_authentication_success:ratio1h) / (1 - 0.999)
      - record: vid:slo_authentication_success:burnrate6h
        expr: (1 - vid:kpi_authentication_success:ratio6h) / (1 - 0.999)
      - record: vid:slo_authentication_success:error_budget_remaining30d
        expr: clamp_max(clamp_min(1 - ((1 - vid:kpi_authentication_success:ratio30d) / (1 - 0.999)), 0), 1)

      - record: vid:slo_authentication_latency:burnrate5m
        expr: (1 - vid:kpi_authentication_latency_under_500ms:ratio5m) / (1 - 0.95)
      - record: vid:slo_authentication_latency:burnrate1h
        expr: (1 - vid:kpi_authentication_latency_under_500ms:ratio1h) / (1 - 0.95)
      - record: vid:slo_authentication_latency:burnrate6h
        expr: (1 - vid:kpi_authentication_latency_under_500ms:ratio6h) / (1 - 0.95)
      - record: vid:slo_authentication_latency:error_budget_remaining30d
        expr: clamp_max(clamp_min(1 - ((1 - vid:kpi_authentication_latency_under_500ms:ratio30d) / (1 - 0.95)), 0), 1)

      - record: vid:slo_otp_delivery:burnrate5m
        expr: (1 - vid:kpi_otp_delivery_success:ratio5m) / (1 - 0.95)
      - record: vid:slo_otp_delivery:burnrate1h
        expr: (1 - vid:kpi_otp_delivery_success:ratio1h) / (1 - 0.95)
      - record: vid:slo_otp_delivery:burnrate6h
        expr: (1 - vid:kpi_otp_delivery_success:ratio6h) / (1 - 0.95)
      - record: vid:slo_otp_delivery:error_budget_remaining30d
        expr: clamp_max(clamp_min(1 - ((1 - vid:kpi_otp_delivery_success:ratio30d) / (1 - 0.95)), 0), 1)

      - record: vid:slo_token_issuance:burnrate5m
        expr: (1 - vid:kpi_token_issuance_success:ratio5m) / (1 - 0.999)
      - record: vid:slo_token_issuance:burnrate1h
        expr: (1 - vid:kpi_token_issuance_success:ratio1h) / (1 - 0.999)
      - record: vid:slo_token_issuance:burnrate6h
        expr: (1 - vid:kpi_token_issuance_success:ratio6h) / (1 - 0.999)
      - record: vid:slo_token_issuance:error_budget_remaining30d
        expr: clamp_max(clamp_min(1 - ((1 - vid:kpi_token_issuance_success:ratio30d) / (1 - 0.999)), 0), 1)

      - record: vid:slo_platform_availability:burnrate5m
        expr: (1 - vid:kpi_platform_availability:ratio5m) / (1 - 0.999)
      - record: vid:slo_platform_availability:burnrate1h
        expr: (1 - vid:kpi_platform_availability:ratio1h) / (1 - 0.999)
      - record: vid:slo_platform_availability:burnrate6h
        expr: (1 - vid:kpi_platform_availability:ratio6h) / (1 - 0.999)
      - record: vid:slo_platform_availability:error_budget_remaining30d
        expr: clamp_max(clamp_min(1 - ((1 - vid:kpi_platform_availability:ratio30d) / (1 - 0.999)), 0), 1)
