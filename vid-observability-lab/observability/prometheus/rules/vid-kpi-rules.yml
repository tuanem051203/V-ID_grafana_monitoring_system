groups:
  - name: vid-kpi-short-window
    interval: 30s
    rules:
      # KPI-01 excludes business/user rejections. Eligible failures are
      # system_error only; successes carry reason="none".
      - record: vid:kpi_authentication_success:ratio5m
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_requests_total{result="success"}[5m])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_auth_requests_total{reason=~"none|system_error"}[5m])
            ),
            1e-9
          )
      - record: vid:kpi_authentication_success:ratio1h
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_requests_total{result="success"}[1h])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_auth_requests_total{reason=~"none|system_error"}[1h])
            ),
            1e-9
          )

      # KPI-02 is service latency for eligible authentication traffic.
      - record: vid:kpi_authentication_latency_under_500ms:ratio5m
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_request_duration_seconds_bucket{
              le="0.5",reason=~"none|system_error"
            }[5m])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_auth_request_duration_seconds_count{
                reason=~"none|system_error"
              }[5m])
            ),
            1e-9
          )
      - record: vid:kpi_authentication_latency_under_500ms:ratio1h
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_request_duration_seconds_bucket{
              le="0.5",reason=~"none|system_error"
            }[1h])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_auth_request_duration_seconds_count{
                reason=~"none|system_error"
              }[1h])
            ),
            1e-9
          )

      # KPI-03 excludes invalid destination and client-side rate limiting.
      - record: vid:kpi_otp_delivery_success:ratio5m
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_send_attempts_total{result="delivered"}[5m])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_otp_send_attempts_total{
                result=~"delivered|failed",
                reason=~"none|provider_error|timeout"
              }[5m])
            ),
            1e-9
          )
      - record: vid:kpi_otp_delivery_success:ratio1h
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_send_attempts_total{result="delivered"}[1h])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_otp_send_attempts_total{
                result=~"delivered|failed",
                reason=~"none|provider_error|timeout"
              }[1h])
            ),
            1e-9
          )

      # KPI-04 is a product baseline. All terminal verification outcomes remain
      # in the denominator; no SLO/burn-rate alert is attached.
      - record: vid:kpi_otp_verification_success:ratio5m
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_verification_attempts_total{result="success"}[5m])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_otp_verification_attempts_total[5m])
            ),
            1e-9
          )
      - record: vid:kpi_otp_verification_success:ratio1h
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_verification_attempts_total{result="success"}[1h])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_otp_verification_attempts_total[1h])
            ),
            1e-9
          )

      # KPI-05 excludes protocol/business rejection invalid_grant.
      - record: vid:kpi_token_issuance_success:ratio5m
        expr: |
          sum by (environment, cluster) (
            rate(vid_token_requests_total{result="issued"}[5m])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_token_requests_total{
                reason=~"none|signing_error|storage_error|system_error"
              }[5m])
            ),
            1e-9
          )
      - record: vid:kpi_token_issuance_success:ratio1h
        expr: |
          sum by (environment, cluster) (
            rate(vid_token_requests_total{result="issued"}[1h])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_token_requests_total{
                reason=~"none|signing_error|storage_error|system_error"
              }[1h])
            ),
            1e-9
          )

      # KPI-06 measures critical traffic and treats only 5xx as unavailable.
      - record: vid:kpi_platform_availability:ratio5m
        expr: |
          sum by (environment, cluster) (
            rate(vid_http_requests_total{
              critical="true",status_code!~"5.."
            }[5m])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_http_requests_total{critical="true"}[5m])
            ),
            1e-9
          )
      - record: vid:kpi_platform_availability:ratio1h
        expr: |
          sum by (environment, cluster) (
            rate(vid_http_requests_total{
              critical="true",status_code!~"5.."
            }[1h])
          )
          /
          clamp_min(
            sum by (environment, cluster) (
              rate(vid_http_requests_total{critical="true"}[1h])
            ),
            1e-9
          )

      - record: vid:eligible_requests:rate5m
        expr: |
          sum by (environment, cluster, kpi) (
            label_replace(
              rate(vid_auth_requests_total{
                reason=~"none|system_error"
              }[5m]),
              "kpi", "authentication", "", ""
            )
            or
            label_replace(
              rate(vid_otp_send_attempts_total{
                result=~"delivered|failed",
                reason=~"none|provider_error|timeout"
              }[5m]),
              "kpi", "otp_delivery", "", ""
            )
            or
            label_replace(
              rate(vid_otp_verification_attempts_total[5m]),
              "kpi", "otp_verification", "", ""
            )
            or
            label_replace(
              rate(vid_token_requests_total{
                reason=~"none|signing_error|storage_error|system_error"
              }[5m]),
              "kpi", "token_issuance", "", ""
            )
            or
            label_replace(
              rate(vid_http_requests_total{critical="true"}[5m]),
              "kpi", "platform", "", ""
            )
          )

  - name: vid-kpi-long-window
    interval: 1m
    rules:
      - record: vid:kpi_authentication_success:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_requests_total{result="success"}[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_auth_requests_total{reason=~"none|system_error"}[6h])
          ), 1e-9)
      - record: vid:kpi_authentication_success:ratio24h
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_requests_total{result="success"}[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_auth_requests_total{reason=~"none|system_error"}[24h])
          ), 1e-9)
      - record: vid:kpi_authentication_success:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_requests_total{result="success"}[30d])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_auth_requests_total{reason=~"none|system_error"}[30d])
          ), 1e-9)

      - record: vid:kpi_authentication_latency_under_500ms:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_request_duration_seconds_bucket{
              le="0.5",reason=~"none|system_error"
            }[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_auth_request_duration_seconds_count{
              reason=~"none|system_error"
            }[6h])
          ), 1e-9)
      - record: vid:kpi_authentication_latency_under_500ms:ratio24h
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_request_duration_seconds_bucket{
              le="0.5",reason=~"none|system_error"
            }[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_auth_request_duration_seconds_count{
              reason=~"none|system_error"
            }[24h])
          ), 1e-9)
      - record: vid:kpi_authentication_latency_under_500ms:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(vid_auth_request_duration_seconds_bucket{
              le="0.5",reason=~"none|system_error"
            }[30d])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_auth_request_duration_seconds_count{
              reason=~"none|system_error"
            }[30d])
          ), 1e-9)

      - record: vid:kpi_otp_delivery_success:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_send_attempts_total{result="delivered"}[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_otp_send_attempts_total{
              result=~"delivered|failed",
              reason=~"none|provider_error|timeout"
            }[6h])
          ), 1e-9)
      - record: vid:kpi_otp_delivery_success:ratio24h
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_send_attempts_total{result="delivered"}[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_otp_send_attempts_total{
              result=~"delivered|failed",
              reason=~"none|provider_error|timeout"
            }[24h])
          ), 1e-9)
      - record: vid:kpi_otp_delivery_success:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_send_attempts_total{result="delivered"}[30d])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_otp_send_attempts_total{
              result=~"delivered|failed",
              reason=~"none|provider_error|timeout"
            }[30d])
          ), 1e-9)

      - record: vid:kpi_otp_verification_success:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_verification_attempts_total{result="success"}[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_otp_verification_attempts_total[6h])
          ), 1e-9)
      - record: vid:kpi_otp_verification_success:ratio24h
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_verification_attempts_total{result="success"}[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_otp_verification_attempts_total[24h])
          ), 1e-9)
      - record: vid:kpi_otp_verification_success:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(vid_otp_verification_attempts_total{result="success"}[30d])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_otp_verification_attempts_total[30d])
          ), 1e-9)

      - record: vid:kpi_token_issuance_success:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(vid_token_requests_total{result="issued"}[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_token_requests_total{
              reason=~"none|signing_error|storage_error|system_error"
            }[6h])
          ), 1e-9)
      - record: vid:kpi_token_issuance_success:ratio24h
        expr: |
          sum by (environment, cluster) (
            rate(vid_token_requests_total{result="issued"}[24h])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_token_requests_total{
              reason=~"none|signing_error|storage_error|system_error"
            }[24h])
          ), 1e-9)
      - record: vid:kpi_token_issuance_success:ratio30d
        expr: |
          sum by (environment, cluster) (
            rate(vid_token_requests_total{result="issued"}[30d])
          )
          /
          clamp_min(sum by (environment, cluster) (
            rate(vid_token_requests_total{
              reason=~"none|signing_error|storage_error|system_error"
            }[30d])
          ), 1e-9)

      - record: vid:kpi_platform_availability:ratio6h
        expr: |
          sum by (environment, cluster) (
            rate(vid_http_requests_total{
              critical="true",status_code!~"5.."
            }[6h])
          )
          /
          clamp_min(sum by (environment, cluster) (
