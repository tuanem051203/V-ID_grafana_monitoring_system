[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vid-metrics-simulator"
version = "2.0.0"
description = "Production-like Prometheus metrics simulator for V-ID observability."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "prometheus-client==0.22.1",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.9.0",
  "pyright==1.1.403",
  "ruff==0.12.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
