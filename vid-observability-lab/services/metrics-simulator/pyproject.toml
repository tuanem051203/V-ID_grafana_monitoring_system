[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vid-metrics-simulator"
version = "1.0.0"
description = "Deterministic Prometheus metrics simulator for V-ID observability development."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "prometheus-client==0.22.1",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
